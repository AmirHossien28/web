<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b16" media="(prefers-color-scheme: dark)" />

    <title>علاءالدین DXP — طراحی و مهندسی وب‌سایت سازمانی</title>
    <meta
      name="description"
      content="طراحی اختصاصی، مهندسی فرانت‌اند و بهینه‌سازی سرعت برای سازمان‌ها؛ با تعهدنامه سطح خدمت، قیمت شفاف و دیزاین سیستم اختصاصی."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aladdin DXP" />
    <meta property="og:title" content="علاءالدین DXP — طراحی و مهندسی وب‌سایت سازمانی" />
    <meta
      property="og:description"
      content="پلتفرم مهندسی وب با دیزاین سیستم اختصاصی، استانداردهای دسترس‌پذیری WCAG 2.2 و تضمین سطح خدمت."
    />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Persian-first typography: Vazirmatn for text, JetBrains Mono for codes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!--
      Theme is resolved before first paint so the interface never flashes the
      wrong palette: stored preference first, then the operating system default.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('aladdin.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <script>
      (function () {
        var show = function (message) {
          var box = document.createElement('pre');
          box.setAttribute('dir', 'ltr');
          box.style.cssText =
            'margin:2rem;padding:1rem;border:1px solid #fecdca;border-radius:8px;background:#fef3f2;color:#b42318;font:13px/1.6 monospace;white-space:pre-wrap';
          box.textContent = 'Aladdin DXP could not start:\n\n' + message;
          document.body.appendChild(box);
        };
        var boot = function () {
        try {
          var base64 = document.getElementById('app-payload').textContent.replace(/\s+/g, '');
          var binary = atob(base64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          var code = new TextDecoder('utf-8').decode(bytes);
          new Function(code)();
        } catch (error) {
          show((error && error.message) || String(error));
        }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot);
        } else {
          boot();
        }
      })();
